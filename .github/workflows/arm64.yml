# arm64 (aarch64-linux-gnu) target: vcc built natively on an arm64 Linux
# runner, the C suites (gcc torture, tcc tests2, src/tests/vcc) run under
# qemu-system-aarch64 against clang's build, plus the fast harnesses.  ASan
# and TSan builds are jobs of their own, alongside; TSan's runs on an x86-64
# runner for now (the same arm64 target, vcc as an x86-64 program).  No
# kernel, no PostgreSQL.
# ci/premerge.sh holds the commands; run it locally in env/linux/run.sh.
name: arm64
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.job }}
    runs-on: ${{ matrix.os }}
    container: debian:trixie
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { job: arm64, os: ubuntu-24.04-arm }
          - { job: asan,  os: ubuntu-24.04-arm }
          - { job: tsan,  os: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v4
      - run: ci/setup-debian.sh
        id: setup
      # ccache and the harnesses' caches of work that does not depend on the
      # commit's vcc: clang's reference results (ctests/ref, dwarfref) and
      # vcc objects byte-identical to ones that passed (ctests/pass).  They
      # check their own keys (source, flags, runtime); toolfp covers the tool
      # versions, runner.arch the host (ccache holds host objects).  A PR
      # restores from its own earlier runs, else from main's.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            build/linux/src/ctests/ref
            build/linux/src/ctests/pass
            build/linux/src/dwarfref
          key: ci-${{ matrix.job }}-${{ runner.arch }}-${{ steps.setup.outputs.toolfp }}-${{ github.sha }}
          restore-keys: ci-${{ matrix.job }}-${{ runner.arch }}-${{ steps.setup.outputs.toolfp }}-
      - run: ci/premerge.sh ${{ matrix.job }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ matrix.job }}-logs
          path: build/linux/ci-logs/
          if-no-files-found: ignore
