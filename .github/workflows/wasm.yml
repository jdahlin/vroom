# WebAssembly (wasm64-unknown-emscripten) target: the same C suites through
# vcc -S, linked by emcc and run under node against clang's build
# (bench/vcc-wasm.py).  vcc itself runs on an x86-64 Linux runner for now.
#
# DISABLED (2026-11-13, by decision; docs/PLAN-wasm.md): the wasm target is not
# built by default (ccs/Makefile VCC_WASM) and is left to rot until needed, so
# this workflow is manual-only and not part of the premerge gate.  To turn it
# back on: build with VCC_WASM=1 (ci/premerge.sh wasm does) and restore
# `workflow_call:` below and the `wasm` job and gate's `needs` in premerge.yml.
name: wasm
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wasm:
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # emsdk itself is not cached: its install takes ~15 s, saving the
      # directory took ~50 s.  Its cache/ (libraries emcc builds on first use,
      # wasm64's are not prebuilt) is, with the harness's caches (see arm64.yml).
      - run: ci/setup-debian.sh wasm
        id: setup
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            /opt/emsdk/upstream/emscripten/cache
            build/linux/ccs/wasmtests/ref
            build/linux/ccs/wasmtests/pass
          key: ci-wasm-${{ runner.arch }}-${{ steps.setup.outputs.toolfp }}-${{ github.sha }}
          restore-keys: ci-wasm-${{ runner.arch }}-${{ steps.setup.outputs.toolfp }}-
      - run: ci/premerge.sh wasm
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: wasm-logs
          path: build/linux/ci-logs/
          if-no-files-found: ignore
