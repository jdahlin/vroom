# x86-64 Linux runners (ubuntu-24.04, more and cheaper than the arm ones):
# the expensive sanitizer jobs and the steps that need an x86-64 host.
#   x86   vcc built for x86-64: host dispatch, x86 objects, VIR x86, ...
#   asan  ASan+UBSan build (arm64 target suites under qemu, as before)
#   tsan  TSan build: vcc suite, VIR x86
#   tsan-vccd  TSan build: vccd and its stress run (split for wall time)
# Cache keys carry runner.arch, so they never mix with arm64.yml's.
# ci/premerge.sh holds the commands.
name: x86
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.job }}
    runs-on: ${{ matrix.os }}
    container: debian:trixie
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { job: x86,  os: ubuntu-24.04 }
          - { job: asan, os: ubuntu-24.04 }
          - { job: tsan, os: ubuntu-24.04 }
          - { job: tsan-vccd, os: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v4
      - run: ci/setup-debian.sh
        id: setup
      # ccache and the harnesses' caches of work that does not depend on the
      # commit's vcc: clang's reference results (ctests/ref, dwarfref) and
      # vcc objects byte-identical to ones that passed (ctests/pass).  They
      # check their own keys (source, flags, runtime); toolfp covers the tool
      # versions, runner.arch the host (ccache holds host objects).  A PR
      # restores from its own earlier runs, else from main's.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            build/linux/src/ctests/ref
            build/linux/src/ctests/pass
            build/linux/src/dwarfref
          key: ci-${{ matrix.job }}-${{ runner.arch }}-${{ steps.setup.outputs.toolfp }}-${{ github.sha }}
          restore-keys: ci-${{ matrix.job }}-${{ runner.arch }}-${{ steps.setup.outputs.toolfp }}-
      - run: ci/premerge.sh ${{ matrix.job }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ matrix.job }}-logs
          path: build/linux/ci-logs/
          if-no-files-found: ignore
